<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Maleta · Checklist</title>
  <meta name="description" content="Checklist rápido y offline"/>
  <meta name="theme-color" content="#7c5cff"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Maleta"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="./icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./styles/main.css"/>
</head>
<body>

  <div id="app">

    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <div class="logoDot"></div>
        <div class="brandText">
          <h1 class="brandTitle">Maleta</h1>
          <p class="brandSub">Checklist rápido (offline)</p>
        </div>
      </div>
      <button id="btnSettings" class="iconBtn" aria-label="Administrar listas" title="Mis listas">⚙️</button>
    </header>

    <!-- Hero card -->
    <section class="hero">
      <div class="heroCard">

        <button id="tripPill" class="pill" title="Cambiar lista">🧾 Mi lista</button>

        <div class="progressWrap">
          <div class="progressMeta">
            <span id="progressText">0/0</span>
            <span id="progressPct">0%</span>
          </div>
          <div class="progressBar" id="progressBar" role="progressbar"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progressFill" id="progressFill"></div>
          </div>
        </div>

        <div class="heroActions">
          <button id="btnAdd" class="btn primary">＋ Agregar</button>
          <button id="btnReset" class="btn">↺ Reiniciar</button>
        </div>

        <div class="heroQuick">
          <button id="btnSelectAll" class="btn mini">✅ Marcar todo</button>
          <button id="btnUncheckAll" class="btn mini">⬜ Quitar todo</button>
        </div>

      </div>
    </section>

    <!-- Items list -->
    <section id="list" class="list" aria-label="Lista de ítems"></section>

    <!-- Footer bar -->
    <footer class="bottombar">
      <button id="btnSelectAllFooter" class="footerBtn">✅ Todo</button>
      <button id="btnUncheckAllFooter" class="footerBtn">⬜ Nada</button>
      <button id="btnAddFooter" class="footerBtn accent">＋ Agregar</button>
    </footer>

  </div><!-- /#app -->

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ───────────────────────────────────────────────────
       Modal: Agregar ítem
  ─────────────────────────────────────────────────── -->
  <div id="addOverlay" class="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
      <div class="modalHeader">
        <h2 class="modalTitle" id="addTitle">Agregar ítem</h2>
        <button id="btnCloseAdd" class="closeBtn" aria-label="Cerrar">✕</button>
      </div>
      <div class="modalBody">
        <label class="field">
          <span>Nombre</span>
          <input id="newName" class="input" placeholder="Ej: Cargador, llaves, medias…"
                 maxlength="80" autocomplete="off"/>
        </label>
        <label class="field">
          <span>Emoji (opcional)</span>
          <input id="newEmoji" class="input emojiInput" placeholder="🔌"
                 maxlength="4" autocomplete="off"/>
        </label>
        <label class="field">
          <span>Lista destino</span>
          <select id="newItemList" class="select"></select>
        </label>
        <button id="btnCreate" class="btn primary full">Agregar a la lista</button>
      </div>
    </div>
  </div>

  <!-- ───────────────────────────────────────────────────
       Modal: Mis listas
  ─────────────────────────────────────────────────── -->
  <div id="listsOverlay" class="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="listsTitle">
      <div class="modalHeader">
        <h2 class="modalTitle" id="listsTitle">Mis listas</h2>
        <button id="btnCloseLists" class="closeBtn" aria-label="Cerrar">✕</button>
      </div>
      <div class="modalBody">

        <div id="listsList" class="listsList"></div>

        <div class="divider"></div>

        <p class="sectionLabel">Nueva lista</p>

        <label class="field">
          <span>Nombre</span>
          <input id="newListName" class="input" placeholder="Ej: Concierto, camping, ensayo…"
                 maxlength="40" autocomplete="off"/>
        </label>

        <div class="inlineRow">
          <label class="field grow">
            <span>Emoji</span>
            <input id="newListIcon" class="input emojiInput" placeholder="📋"
                   maxlength="4" autocomplete="off"/>
          </label>
          <button id="btnCreateList" class="btn primary selfEnd">Crear lista</button>
        </div>

      </div>
    </div>
  </div>

  <script src="./src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
